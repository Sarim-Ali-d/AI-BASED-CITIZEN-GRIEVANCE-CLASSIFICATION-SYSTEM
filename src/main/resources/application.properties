# ==========================================
#  Server
# ==========================================
server.port=8080
spring.application.name=citizen-grievance-system

# ==========================================
#  H2 In-Memory Database
# ==========================================
#spring.datasource.url=JDBC:h2:mem:grievancedb;DB_CLOSE_DELAY=-1
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# ==========================================
#  JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
#  Anthropic Claude AI
# ==========================================
anthropic.api.key=${ANTHROPIC_API_KEY:your-api-key-here}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=claude-sonnet-4-20250514

# ==========================================
#  Jackson
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null

# ==========================================
#  Logging
# ==========================================
logging.level.com.grievance=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=DEBUG

spring.datasource.url=jdbc:mysql://localhost:3306/grievancedb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
